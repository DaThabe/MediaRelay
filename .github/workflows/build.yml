name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore
        run: dotnet restore
      
      - name: Build
        run: dotnet build -c Release --no-restore
      
      - name: Test
        run: dotnet test -c Release --no-build
      
      - name: Publish
        run: dotnet publish src/MediaRelay.Launcher -c Release -r win-x64 -o ./publish
      
      - name: Zip
        run: Compress-Archive -Path ./publish/* -DestinationPath ./MediaRelay-Win64.zip
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaRelay
          path: ./MediaRelay-Win64.zip
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ./MediaRelay-Win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}